<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ESP32 Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="box">
        <div class="smiley">
            <svg viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="#33ff33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="32" cy="32" r="30"/>
                <circle cx="22" cy="24" r="4"/>
                <circle cx="42" cy="24" r="4"/>
                <path d="M 20 42 Q 32 50 44 42"/>
            </svg>
        </div>
        
        <div class="title">ESP32 Terminal</div>
        
        <form id="loginForm">
            <input class="input-field" name="user" placeholder="usuario" value="root" required autocomplete="username" />
            <br/>
            <input class="input-field" name="pass" type="password" placeholder="contraseña" required autocomplete="current-password" />
            <br/>
            <button class="btn" type="submit">Entrar</button>
        </form>
        
        <div id="error" class="error"></div>
        <div class="small">Inactividad 3 min = logout</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
